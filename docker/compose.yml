# Práctica 5 · Modo "una sola PC": infraestructura (PostgreSQL, Redis, Nginx) y los dos nodos, todo junto.
#   docker compose -f docker/compose.yml build
#   docker compose -f docker/compose.yml up -d
#   docker compose -f docker/compose.yml exec nodo1 php artisan migrate --seed --force   (la primera vez)
# Todos los servicios comparten la red del proyecto y se encuentran por nombre (db, redis, nodo1, reverb2...).
#
# Para repartirlo en varias PCs se usan los mismos archivos por separado:
#   docker/infra/compose.yml   PC de infraestructura (BD + Redis + balanceador)
#   docker/nodo/compose.yml    una PC por nodo (app + Reverb + cola)
# Ver docs/balanceo.md y docker/.env.example.
name: trackeat

include:
  - infra/compose.yml
  - nodo/compose.yml
