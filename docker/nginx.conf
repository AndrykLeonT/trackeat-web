# Balanceador de la Práctica 5. Para cambiar de algoritmo, cambia la línea marcada y recarga:
#   docker exec trackeat-balanceador nginx -s reload
upstream trackeat {
    least_conn;        # ip_hash;  o bórrala para turno rotatorio
    server 172.28.0.11:8000 max_fails=2 fail_timeout=10s;
    server 172.28.0.12:8000 max_fails=2 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # El navegador pide el icono en cada recarga y se come un turno.
    location = /favicon.ico { return 204; }

    # WebSockets de Reverb (pantalla de cocina): una sola instancia.
    location /app {
        proxy_pass http://reverb:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://trackeat;

        proxy_set_header Host              $http_host;   # con el puerto
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Si un nodo se apaga, su IP deja de contestar; sin esto Nginx espera 60 s antes de probar el otro.
        proxy_connect_timeout 2s;

        # Para comprobar el reparto: en F12 > Red se ve qué nodo atendió.
        add_header X-Nodo $upstream_addr always;
    }
}
